# Trusted no-mistakes review configuration.
#
# no-mistakes reads `review.path_instructions` only from the default-branch
# copy of this file, so a pushed branch cannot change the review rules. See
# https://kunchenguid.github.io/no-mistakes/reference/repo-config/
review:
  path_instructions:
    - path: src/**
      instructions: &axi |
        upkeep-axi is an AXI CLI. Check this change against the ten principles in
        `.agents/skills/axi/SKILL.md`. For each touched principle—output shape and
        size, defaults and `--fields`, truncation, aggregates, empty states, errors
        and exit codes and hints, ambient context, content first, contextual
        disclosure, and help and the `--version` fast path—state whether it is
        upheld. Treat a departure as a finding unless `VISION.md` or `AGENTS.md`
        documents it as a deliberate choice. A change to the default row set or a
        block's row shape must bump `schemaVersion` and update `README` and the
        generated skill.
    - path: bin/**
      instructions: *axi
    - path: skills/**
      instructions: *axi
